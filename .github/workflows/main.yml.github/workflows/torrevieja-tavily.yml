name: Torrevieja Tavily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Tavily search
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python torrevieja/tavily_update.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "torrevieja-bot"
          git config user.email "actions@github.com"
          git add torrevieja/data.json
          git diff --cached --quiet || git commit -m "Update Torrevieja Tavily leads"
          git push
