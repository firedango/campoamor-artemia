<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Villaggio Aurora Admin</title><style>:root{--navy:#06182B;--blue:#0C3D66;--orange:#F28A2E;--muted:#AFC4D6;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.06)}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:white;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:32px 0 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:#FFAA54;font-size:11px;font-weight:900;letter-spacing:.14em}.top h1{margin:6px 0;font-size:42px}.sub{color:var(--muted)}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer}.primary{background:var(--orange);color:#21170e}.secondary{background:var(--glass);color:white;border:1px solid var(--line)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi,.card{background:linear-gradient(145deg,rgba(16,63,103,.78),rgba(7,29,50,.95));border:1px solid var(--line);border-radius:18px;padding:18px}.kpi small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.kpi strong{display:block;margin-top:12px;font-size:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}.tab{background:var(--glass);color:white;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer}.tab.active{background:var(--orange);color:#21170e;border-color:transparent}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar input{min-width:280px;background:#081f36;color:white;border:1px solid var(--line);border-radius:12px;padding:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:900px;background:#071c31}.table th{background:#0A2744;text-align:left;padding:12px;font-size:11px}.table td{border-top:1px solid rgba(255,255,255,.07);padding:12px;font-size:13px}.table tr:hover td{background:rgba(255,255,255,.03)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(242,138,46,.12);color:#FFAA54;font-size:10px;font-weight:900}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-start;justify-content:center;padding:30px;overflow:auto}.modal.open{display:flex}.panel{width:min(760px,100%);background:#081f36;border:1px solid var(--line);border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#06182B;color:white;border:1px solid var(--line);border-radius:11px;padding:11px}.field textarea{min-height:90px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.status{position:fixed;right:16px;bottom:16px;background:#0A2744;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{min-width:0}.actions{justify-content:stretch}.actions .btn{flex:1}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">ARTEMIA GROUP · PROCUREMENT ADMIN</div><h1>Villaggio Aurora</h1><div class="sub">Interfaccia protetta collegata direttamente al Google Sheet.</div></div><div><button class="btn secondary" onclick="syncNow()">Sincronizza GitHub</button></div></div><div class="kpis" id="kpis"></div><div class="tabs" id="tabs"></div><div class="toolbar"><input id="q" placeholder="Cerca…" oninput="renderTable()"><button class="btn primary" onclick="newRecord()">+ Nuovo record</button></div><div class="tablewrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal"><div class="panel"><div class="top"><div><div class="eyebrow" id="modalEyebrow"></div><h2 id="modalTitle" style="margin:4px 0 0"></h2></div><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div class="grid" id="formGrid" style="margin-top:18px"></div><div class="actions"><button class="btn secondary" id="deleteBtn" onclick="deleteCurrent()">Elimina</button><button class="btn primary" onclick="saveCurrent()">Salva e sincronizza</button></div></div></div><div class="status" id="status"></div><script>
const TABLES=['FORNITORI','PREVENTIVI','ORDINI','CONTATTI'];let DB=null,current='FORNITORI',editing=null;
const schemas={
FORNITORI:['Fornitore_ID','Ragione sociale','Categoria','Paese','Città','Sito','Telefono','Email','Referente principale','Canale preferito','Affidabilità','Stato','Ultimo contatto','Note','Creato il'],
PREVENTIVI:['Preventivo_ID','Fornitore_ID','Materiale_ID','Data richiesta','Data preventivo','Quantità','UM','Prezzo unit. netto','Totale netto','Trasporto','Dazi','Altri costi','Costo landed','Lead time','Validità offerta','Stato','Documento / link','Note'],
ORDINI:['Ordine_ID','Preventivo_ID','Fornitore_ID','Materiale_ID','Data ordine','Quantità','Totale ordine','Acconto','Saldo','Data consegna prevista','Data consegna effettiva','Stato','Tracking / riferimento','Documento ordine','Note','Aggiornato il'],
CONTATTI:['Contatto_ID','Fornitore_ID','Data','Tipo','Referente','Oggetto','Esito','Prossima azione','Note']};
const hiddenAuto=new Set(['Creato il','Aggiornato il','Costo landed']);
function boot(){google.script.run.withSuccessHandler(d=>{DB=d;renderAll()}).withFailureHandler(err=>toast(err.message||err)).getBootstrapData()}
function renderAll(){renderKpis();renderTabs();renderTable()}
function renderKpis(){const s=DB.stats||{};document.getElementById('kpis').innerHTML=[['Materiali',s.materiali],['Fornitori',s.fornitori],['Preventivi',s.preventivi],['Ordini',s.ordini]].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]||0}</strong></div>`).join('')}
function renderTabs(){document.getElementById('tabs').innerHTML=TABLES.map(t=>`<button class="tab ${t===current?'active':''}" onclick="setTable('${t}')">${t}</button>`).join('')}
function setTable(t){current=t;editing=null;renderTabs();renderTable()}
function rows(){return (DB[current.toLowerCase()]||[])}
function renderTable(){const q=(document.getElementById('q').value||'').toLowerCase();const data=rows().filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));const cols=schemas[current].slice(0,8);document.getElementById('thead').innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'<th></th></tr>';document.getElementById('tbody').innerHTML=data.map((r,i)=>'<tr>'+cols.map(c=>`<td>${fmt(r[c])}</td>`).join('')+`<td><button class="btn secondary" onclick='editById(${JSON.stringify(r[schemas[current][0]])})'>Apri</button></td></tr>`).join('')}
function fmt(v){if(v===null||v===undefined||v==='')return '<span class="sub">—</span>';return String(v)}
function editById(id){editing=rows().find(r=>String(r[schemas[current][0]])===String(id));openModal()}
function newRecord(){editing={};openModal()}
function openModal(){document.getElementById('modalEyebrow').textContent=current;document.getElementById('modalTitle').textContent=editing&&editing[schemas[current][0]]?'Modifica record':'Nuovo record';document.getElementById('deleteBtn').style.display=editing&&editing[schemas[current][0]]?'inline-block':'none';document.getElementById('formGrid').innerHTML=schemas[current].filter(k=>!hiddenAuto.has(k)).map(k=>fieldHtml(k,editing[k])).join('');document.getElementById('modal').classList.add('open')}
function fieldHtml(k,v){const long=/Note|Oggetto|Esito|Prossima azione/.test(k);const type=/Data|Validità/.test(k)?'date':/Prezzo|Totale|Trasporto|Dazi|Altri costi|Quantità|Acconto|Saldo/.test(k)?'number':'text';const id='f_'+btoa(unescape(encodeURIComponent(k))).replace(/=/g,'');return `<div class="field" style="${long?'grid-column:1/-1':''}"><label>${k}</label>${long?`<textarea id="${id}" data-key="${k}">${v||''}</textarea>`:`<input id="${id}" data-key="${k}" type="${type}" step="any" value="${v||''}">`}</div>`}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function collect(){const out=Object.assign({},editing||{});document.querySelectorAll('#formGrid [data-key]').forEach(el=>out[el.dataset.key]=el.type==='number'&&el.value!==''?Number(el.value):el.value);return out}
function saveCurrent(){const rec=collect();busy('Salvataggio…');google.script.run.withSuccessHandler(()=>{closeModal();reload('Salvato e sincronizzato')}).withFailureHandler(err=>toast(err.message||err)).saveRecord(current,rec)}
function deleteCurrent(){if(!editing||!editing[schemas[current][0]])return;if(!confirm('Eliminare questo record?'))return;busy('Eliminazione…');google.script.run.withSuccessHandler(()=>{closeModal();reload('Record eliminato')}).withFailureHandler(err=>toast(err.message||err)).deleteRecord(current,editing[schemas[current][0]])}
function syncNow(){busy('Sincronizzazione…');google.script.run.withSuccessHandler(()=>reload('GitHub aggiornato')).withFailureHandler(err=>toast(err.message||err)).syncToGitHub()}
function reload(msg){google.script.run.withSuccessHandler(d=>{DB=d;renderAll();toast(msg)}).withFailureHandler(err=>toast(err.message||err)).getBootstrapData()}
function busy(msg){toast(msg,60000)}function toast(msg,ms=2600){const e=document.getElementById('status');e.textContent=msg;e.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>e.style.display='none',ms)}
boot();
</script></body></html>
